[build-system]
requires = ["setuptools>=65.5"]
build-backend = "setuptools.build_meta"

[project]
name = "scicap"
version = "0.1.0"
description = "SciCap invoke: Boutiques/CWL profile plus ALLOW/REJECT/ABSTAIN"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0",
  "jsonschema>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
scicap = "scicap_core.cli:main"

[tool.setuptools]
include-package-data = true
packages = ["scicap_core"]

[tool.setuptools.package-dir]
scicap_core = "packages/scicap-core"

[tool.setuptools.package-data]
scicap_core = ["result.schema.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
