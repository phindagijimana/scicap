# SciCap profile (M1, M2, M4). Reuses Boutiques/CWL identity; not a new descriptor language.
# M1: capability predicates; bind space/modality to the instance at invoke time.
# M2: invoke returns ALLOW | REJECT | ABSTAIN.
# M4: silent-failure disclosures; exit 0 is not scientific success.
id: neuro.t1.anatomical_segmentation
version: 0.1.0
purpose: Segment anatomical T1w MRI into tissue or regional labels
task_taxonomy: morphometry.anatomical_segmentation
modality: T1w
intended_use: research_only
exclusions:
  - clinical_diagnosis
  - lesion_masked_anatomy_without_review
input:
  kind: structural_mri
  modality: T1w
  format: nifti
  space: subject_native
  # space/atlas here are required values when bound, not defaults to infer (M1).
preconditions:
  - anatomical_image_available
  - compatible_segmentation_environment
output:
  kind: anatomical_label_image
  value_type: discrete_labels
  output_completeness: unknown
unsupported_cases:
  - lesion_or_resection_distorting_anatomy
  - non_t1w_offered_as_anatomical
  - pediatric_or_atypical_anatomy_without_review
qc_required: true
qc_status: unknown
interpretation_limits:
  - do_not_treat_failed_or_partial_segmentation_as_anatomy
  - research_use_only
  - exit_0_is_not_qc_passed
invoke_decisions:
  ALLOW: required predicates established and approval granted
  REJECT: demonstrated contradiction (wrong modality, space, or atlas)
  ABSTAIN: instance metadata insufficient to bind space or QC
validation:
  - input_schema_passed
  - output_labels_present
  - qc_status_passed
execution:
  approval_required: true
  container: ghcr.io/neurodesk/neurodesktop/neurodesktop:2026-06-09@sha256:72a16811e1243a4838f5d8a9a98dc992affa6864e920ac99c31033a42b22fb8d
  backend: local_container
provenance:
  required:
    - parameters
    - software_versions
    - input_hashes
    - execution_id
    - invoke_decision
    - qc_status
