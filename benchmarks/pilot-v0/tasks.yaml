# Pilot-v0 task list. Do not tune contracts on the holdout.
# No results claimed. Gold labels are method fixtures, not evaluation numbers.

schema_version: 0.1
capability: neuro.t1.hippocampal_volumes
holdout_tuning: forbidden
capabilities:
  - neuro.t1.hippocampal_volumes
  - neuro.bids.validate
  - neuro.t1.anatomical_segmentation
  - neuro.t1.register
  - neuro.t1.regional_stats

tasks:
  - id: pilot-complete-t1w
    capability: neuro.t1.hippocampal_volumes
    instance: examples/instances/complete_t1w.json
    gold: ALLOW
    method: M1
  - id: pilot-dk-as-dkt
    capability: neuro.t1.hippocampal_volumes
    instance: examples/instances/dk_as_dkt.json
    gold: REJECT
    method: M1
  - id: pilot-missing-space
    capability: neuro.t1.hippocampal_volumes
    instance: examples/instances/missing_space.json
    gold: ABSTAIN
    method: M2
  - id: pilot-wrong-modality
    capability: neuro.t1.hippocampal_volumes
    instance: examples/instances/wrong_modality.json
    gold: REJECT
    method: M1
  - id: pilot-bids-validate-complete
    capability: neuro.bids.validate
    instance: examples/instances/complete_bids.json
    gold: ALLOW
    method: M1
  - id: pilot-bids-validate-missing-space
    capability: neuro.bids.validate
    instance: examples/instances/missing_space.json
    gold: ABSTAIN
    method: M2
  - id: pilot-seg-complete
    capability: neuro.t1.anatomical_segmentation
    instance: examples/instances/complete_t1w.json
    gold: ALLOW
    method: M1
  - id: pilot-seg-wrong-modality
    capability: neuro.t1.anatomical_segmentation
    instance: examples/instances/wrong_modality.json
    gold: REJECT
    method: M1
  - id: pilot-register-complete
    capability: neuro.t1.register
    instance: examples/instances/complete_t1w.json
    gold: ALLOW
    method: M1
  - id: pilot-register-missing-space
    capability: neuro.t1.register
    instance: examples/instances/missing_space.json
    gold: ABSTAIN
    method: M2
  - id: pilot-register-wrong-space
    capability: neuro.t1.register
    instance: examples/instances/wrong_space_mni.json
    gold: REJECT
    method: M1
  - id: pilot-stats-complete
    capability: neuro.t1.regional_stats
    instance: examples/instances/complete_dkt.json
    gold: ALLOW
    method: M1
  - id: pilot-stats-dk-as-dkt
    capability: neuro.t1.regional_stats
    instance: examples/instances/dk_as_dkt.json
    gold: REJECT
    method: M1
  # Wave 6: point at fetched S0 T1w. Do not copy NIfTI. Holdout stays empty.
  - id: pilot-s0-public-t1w
    capability: neuro.t1.hippocampal_volumes
    instance: examples/instances/s0_public_t1w.json
    t1w: ../shared/data/external/ds000003/sub-01/anat/sub-01_T1w.nii.gz
    gold: ALLOW
    method: M1
    s0: true
  - id: pilot-s0-public-missing-space
    capability: neuro.t1.hippocampal_volumes
    instance: examples/instances/s0_public_missing_space.json
    t1w: ../shared/data/external/ds000003/sub-01/anat/sub-01_T1w.nii.gz
    gold: ABSTAIN
    method: M2
    s0: true
  - id: pilot-s0-public-seg
    capability: neuro.t1.anatomical_segmentation
    instance: examples/instances/s0_public_t1w.json
    t1w: ../shared/data/external/ds000003/sub-01/anat/sub-01_T1w.nii.gz
    gold: ALLOW
    method: M1
    s0: true
  - id: pilot-s0-public-register
    capability: neuro.t1.register
    instance: examples/instances/s0_public_t1w.json
    t1w: ../shared/data/external/ds000003/sub-01/anat/sub-01_T1w.nii.gz
    gold: ALLOW
    method: M1
    s0: true
  - id: pilot-s0-public-bids
    capability: neuro.bids.validate
    instance: examples/instances/s0_public_bids.json
    bids_root: ../shared/data/external/ds000003
    t1w: ../shared/data/external/ds000003/sub-01/anat/sub-01_T1w.nii.gz
    gold: ALLOW
    method: M1
    s0: true
